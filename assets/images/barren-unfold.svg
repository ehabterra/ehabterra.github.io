<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" width="660" height="336" role="img" aria-labelledby="t4 d4">
  <title id="t4">How a shared helper unfolds into copies</title>
  <desc id="d4">Left: the call graph in the code — handler calls a and b, both call one shared helper. Right: the tree the walk builds — one node per path, so helper appears twice. Below: each shared layer doubles the copies, 1, 2, 4, 8, 16; on the measured service 12,882 functions unfolded into 7,147,505 nodes, about 555 copies each.</desc>
  <defs>
    <marker id="gu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6070"/></marker>
    <marker id="bu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34c3e6"/></marker>
    <style>
      .code { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
      .ui   { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="660" height="336" rx="12" fill="#0f1117" stroke="#232631"/>

  <!-- LEFT: the call graph -->
  <rect x="16" y="18" width="286" height="182" rx="10" fill="#101c26" stroke="#34c3e6"/>
  <text class="ui" x="32" y="42" font-size="12.5" font-weight="600" fill="#eeede8">The call graph in the code</text>

  <g fill="none" stroke="#5a6070" stroke-width="1.3" marker-end="url(#gu)">
    <path d="M142,84 C120,94 104,100 92,106"/>
    <path d="M172,84 C194,94 210,100 222,106"/>
    <path d="M92,134 C110,144 128,152 142,158"/>
    <path d="M222,134 C204,144 186,152 172,158"/>
  </g>

  <rect x="118" y="58" width="80" height="26" rx="6" fill="#171a22" stroke="#3a3f4c"/>
  <text class="code" x="132" y="75" font-size="11" fill="#eeede8">handler</text>
  <rect x="58" y="108" width="46" height="26" rx="6" fill="#171a22" stroke="#3a3f4c"/>
  <text class="code" x="76" y="125" font-size="11" fill="#eeede8">a</text>
  <rect x="212" y="108" width="46" height="26" rx="6" fill="#171a22" stroke="#3a3f4c"/>
  <text class="code" x="230" y="125" font-size="11" fill="#eeede8">b</text>
  <rect x="122" y="158" width="72" height="26" rx="6" fill="#171a22" stroke="#34c3e6" stroke-width="1.5"/>
  <text class="code" x="134" y="175" font-size="11" fill="#eeede8">helper</text>
  <text class="ui" x="204" y="175" font-size="10" fill="#34c3e6">one function,</text>
  <text class="ui" x="204" y="188" font-size="10" fill="#34c3e6">two paths in</text>

  <!-- arrow between panels -->
  <line x1="308" y1="108" x2="344" y2="108" stroke="#34c3e6" stroke-width="1.6" marker-end="url(#bu)"/>
  <text class="ui" x="326" y="94" font-size="9.5" fill="#8a94a6" text-anchor="middle">unfolds</text>

  <!-- RIGHT: the tree -->
  <rect x="358" y="18" width="286" height="182" rx="10" fill="#131519" stroke="#3a3f4c" stroke-dasharray="5 4"/>
  <text class="ui" x="374" y="42" font-size="12.5" font-weight="600" fill="#eeede8">The tree the walk builds</text>

  <g fill="none" stroke="#5a6070" stroke-width="1.3" marker-end="url(#gu)">
    <path d="M484,84 C462,94 446,100 434,106"/>
    <path d="M514,84 C536,94 552,100 564,106"/>
    <path d="M434,134 V156"/>
    <path d="M564,134 V156"/>
  </g>

  <rect x="460" y="58" width="80" height="26" rx="6" fill="#171a22" stroke="#3a3f4c"/>
  <text class="code" x="474" y="75" font-size="11" fill="#eeede8">handler</text>
  <rect x="411" y="108" width="46" height="26" rx="6" fill="#171a22" stroke="#3a3f4c"/>
  <text class="code" x="429" y="125" font-size="11" fill="#eeede8">a</text>
  <rect x="541" y="108" width="46" height="26" rx="6" fill="#171a22" stroke="#3a3f4c"/>
  <text class="code" x="559" y="125" font-size="11" fill="#eeede8">b</text>
  <rect x="398" y="158" width="72" height="26" rx="6" fill="#171a22" stroke="#e8a25c"/>
  <text class="code" x="408" y="175" font-size="11" fill="#eeede8">helper</text>
  <rect x="528" y="158" width="72" height="26" rx="6" fill="#171a22" stroke="#e8a25c"/>
  <text class="code" x="538" y="175" font-size="11" fill="#eeede8">helper</text>
  <text class="ui" x="474" y="176" font-size="10" fill="#e8a25c">×2</text>
  <text class="ui" x="374" y="196" font-size="10" fill="#8a94a6">one node per path — the same function, built twice</text>

  <!-- BOTTOM: multiplication by depth -->
  <rect x="16" y="212" width="628" height="106" rx="10" fill="#14161d" stroke="#232631"/>
  <text class="ui" x="32" y="236" font-size="11.5" font-weight="600" fill="#b6b5b0">Stack shared layers, and the copies multiply per level:</text>

  <g fill="#3d4250">
    <rect x="34" y="252" width="10" height="10" rx="2"/>
  </g>
  <g fill="#4a5060">
    <rect x="70" y="252" width="10" height="10" rx="2"/><rect x="83" y="252" width="10" height="10" rx="2"/>
  </g>
  <g fill="#5b6274">
    <rect x="119" y="252" width="10" height="10" rx="2"/><rect x="132" y="252" width="10" height="10" rx="2"/><rect x="145" y="252" width="10" height="10" rx="2"/><rect x="158" y="252" width="10" height="10" rx="2"/>
  </g>
  <g fill="#7a8296">
    <rect x="194" y="252" width="10" height="10" rx="2"/><rect x="207" y="252" width="10" height="10" rx="2"/><rect x="220" y="252" width="10" height="10" rx="2"/><rect x="233" y="252" width="10" height="10" rx="2"/><rect x="246" y="252" width="10" height="10" rx="2"/><rect x="259" y="252" width="10" height="10" rx="2"/><rect x="272" y="252" width="10" height="10" rx="2"/><rect x="285" y="252" width="10" height="10" rx="2"/>
  </g>
  <g fill="#a3abc0">
    <rect x="321" y="252" width="10" height="10" rx="2"/><rect x="334" y="252" width="10" height="10" rx="2"/><rect x="347" y="252" width="10" height="10" rx="2"/><rect x="360" y="252" width="10" height="10" rx="2"/><rect x="373" y="252" width="10" height="10" rx="2"/><rect x="386" y="252" width="10" height="10" rx="2"/><rect x="399" y="252" width="10" height="10" rx="2"/><rect x="412" y="252" width="10" height="10" rx="2"/><rect x="425" y="252" width="10" height="10" rx="2"/><rect x="438" y="252" width="10" height="10" rx="2"/><rect x="451" y="252" width="10" height="10" rx="2"/><rect x="464" y="252" width="10" height="10" rx="2"/><rect x="477" y="252" width="10" height="10" rx="2"/><rect x="490" y="252" width="10" height="10" rx="2"/><rect x="503" y="252" width="10" height="10" rx="2"/><rect x="516" y="252" width="10" height="10" rx="2"/>
  </g>
  <text class="ui" x="540" y="261" font-size="11" fill="#6f6f79">— and cycles</text>
  <text class="ui" x="540" y="274" font-size="11" fill="#6f6f79">keep going…</text>

  <g class="ui" font-size="9.5" fill="#6f6f79">
    <text x="34" y="278">×1</text>
    <text x="70" y="278">×2</text>
    <text x="119" y="278">×4</text>
    <text x="194" y="278">×8</text>
    <text x="321" y="278">×16</text>
  </g>

  <text class="code" x="32" y="304" font-size="11.5" fill="#e8a25c">measured: 12,882 functions → 7,147,505 nodes  (≈555 copies each)</text>
</svg>
